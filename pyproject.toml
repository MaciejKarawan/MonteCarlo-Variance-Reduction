[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "variance-reduction"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = ["numpy>=1.26,<2", "scipy", "matplotlib", "pandas", "seaborn"]

[tool.setuptools.packages.find]
where = ["src"]
